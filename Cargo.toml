[workspace]
resolver = "2"
members = ["crates/engine", "crates/arkanoid", "crates/tanks"]
default-members = ["crates/arkanoid"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
engine = { path = "crates/engine" }
wgpu = { version = "30.0", default-features = true, features = ["webgpu"] }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
pollster = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = "0.3"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
